<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klantdossier</title>
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1f2937; --ink-dim:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-ink:#ffffff;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --chip:#eef2ff;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:76px; -webkit-tap-highlight-color:transparent;
  }
  header.appbar{
    position:sticky; top:0; z-index:20; background:var(--ink); color:#fff;
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  header.appbar h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px;}
  header.appbar .sub{font-size:11px; opacity:.7; margin-top:2px;}
  main{max-width:720px; margin:0 auto; padding:14px 12px 24px;}
  .view{display:none;}
  .view.active{display:block;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:#fff; border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:8px 2px; font-size:11px;
    color:var(--ink-dim); display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:inherit; cursor:pointer; border-radius:10px;
  }
  nav.tabbar button .ico{font-size:19px; line-height:1;}
  nav.tabbar button.active{color:var(--accent); background:var(--chip);}
  nav.tabbar button .badge{
    position:absolute; margin-left:14px; margin-top:-16px; background:var(--bad); color:#fff;
    font-size:9px; font-weight:700; border-radius:8px; min-width:15px; height:15px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  .card{background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); border:1px solid var(--line);}
  .card h2{font-size:15px; margin:0 0 10px; font-weight:700;}
  .card h3{font-size:13px; margin:0 0 8px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.4px;}

  label{display:block; font-size:12px; font-weight:600; color:var(--ink-dim); margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=tel], select, textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:10px; font-size:15px;
    font-family:inherit; background:#fafafa; color:var(--ink);
  }
  textarea{resize:vertical; min-height:60px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; background:#fff;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:11px;
    padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn.secondary{background:#eef0f3; color:var(--ink);}
  .btn.ghost{background:none; color:var(--accent); padding:8px 10px;}
  .btn.danger{background:#fee2e2; color:var(--bad);}
  .btn.small{padding:7px 11px; font-size:12.5px; border-radius:9px;}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn.block{width:100%;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  .row.tight{gap:6px;}

  .chip{display:inline-flex; align-items:center; gap:4px; background:var(--chip); color:var(--accent); font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px;}
  .chip.ok{background:#dcfce7; color:var(--ok);}
  .chip.warn{background:#fef3c7; color:var(--warn);}
  .chip.bad{background:#fee2e2; color:var(--bad);}
  .chip.gray{background:#f1f2f4; color:var(--ink-dim);}

  .empty{text-align:center; padding:40px 16px; color:var(--ink-dim);}
  .empty .ico{font-size:36px; margin-bottom:8px;}

  .search{position:relative; margin-bottom:12px;}
  .search input{padding-left:34px;}
  .search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5;}

  .dossier-item{
    display:flex; align-items:center; gap:10px; padding:12px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer;
  }
  .dossier-item .avatar{
    width:38px; height:38px; border-radius:10px; background:var(--chip); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;
  }
  .dossier-item .info{flex:1; min-width:0;}
  .dossier-item .info .name{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dossier-item .info .meta{font-size:12px; color:var(--ink-dim); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .dossier-item .arrow{color:var(--ink-dim); font-size:18px;}

  .timeline{border-left:2px solid var(--line); margin-left:8px; padding-left:16px;}
  .tl-item{position:relative; margin-bottom:16px;}
  .tl-item::before{content:""; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 1px var(--accent);}
  .tl-item .date{font-size:11px; color:var(--ink-dim); font-weight:600; margin-bottom:3px;}
  .tl-item .body{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}

  .fab{
    position:fixed; right:16px; bottom:84px; z-index:25; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:26px; box-shadow:0 4px 14px rgba(37,99,235,.4); cursor:pointer;
  }

  .thumb{width:100%; max-height:280px; object-fit:contain; border-radius:12px; background:#111; margin-bottom:10px;}
  .dropzone{
    border:2px dashed var(--line); border-radius:14px; padding:28px 14px; text-align:center; color:var(--ink-dim);
    cursor:pointer; background:#fafafa;
  }
  .dropzone.drag{border-color:var(--accent); background:var(--chip); color:var(--accent);}

  .spin{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:#111; color:#fff;
    padding:10px 16px; border-radius:10px; font-size:13.5px; z-index:60; max-width:88%; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:#fff; width:100%; max-width:560px; border-radius:16px 16px 0 0; padding:16px; max-height:85vh; overflow:auto;}
  @media (min-width:600px){ .modal-bg{align-items:center;} .modal{border-radius:16px;} }
  .modal .close{float:right; background:none; border:none; font-size:20px; color:var(--ink-dim); cursor:pointer;}
  .field-hint{font-size:11px; color:var(--ink-dim); margin-top:3px;}
  hr.sep{border:none; border-top:1px solid var(--line); margin:14px 0;}
  .linegrid{display:grid; grid-template-columns:1fr 90px 60px 30px; gap:6px; align-items:end; margin-bottom:6px;}
  .linegrid label{margin:0 0 3px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px;}
  .stat-box{background:var(--chip); border-radius:10px; padding:10px; text-align:center;}
  .stat-box .num{font-size:20px; font-weight:800; color:var(--accent);}
  .stat-box .lbl{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.3px;}
  a{color:var(--accent);}
  .swatch-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .swatch-btns button{border:1px solid var(--line); background:#fafafa; border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:inherit;}
  .swatch-btns button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
</style>
</head>
<body>

<header class="appbar">
  <div>
    <h1>Klantdossier</h1>
    <div class="sub" id="headerSub">0 dossiers</div>
  </div>
  <button class="btn ghost" style="color:#fff" onclick="showView('instellingen')">⚙️</button>
</header>

<main>

  <!-- NIEUW -->
  <section id="view-nieuw" class="view active"></section>

  <!-- DOSSIERS -->
  <section id="view-dossiers" class="view"></section>

  <!-- DOSSIER DETAIL -->
  <section id="view-detail" class="view"></section>

  <!-- AANDACHT NODIG -->
  <section id="view-aandacht" class="view"></section>

  <!-- INSTELLINGEN -->
  <section id="view-instellingen" class="view"></section>

</main>

<div id="toastHost"></div>
<div id="modalHost"></div>

<nav class="tabbar">
  <button data-tab="nieuw" onclick="showView('nieuw')"><span class="ico">📷</span>Nieuw</button>
  <button data-tab="dossiers" onclick="showView('dossiers')"><span class="ico">📁</span>Dossiers</button>
  <button data-tab="aandacht" onclick="showView('aandacht')" style="position:relative"><span class="ico">🔔</span>Aandacht<span class="badge" id="aandachtBadge" style="display:none">0</span></button>
  <button data-tab="instellingen" onclick="showView('instellingen')"><span class="ico">⚙️</span>Instellingen</button>
</nav>

<script src="app.js"></script>
</body>
</html>
